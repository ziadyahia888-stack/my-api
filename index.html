<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>أول موقع ليا على النت</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      color: #f8fafc;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 32px;
      text-align: center;
      backdrop-filter: blur(8px);
    }
    h1 { margin: 0 0 8px; font-size: 1.6rem; }
    p { margin: 0 0 24px; color: #cbd5e1; }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      margin-bottom: 12px;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      background: #38bdf8;
      color: #0f172a;
      margin-bottom: 10px;
    }
    button:hover { background: #7dd3fc; }
    button.secondary { background: transparent; color: #f8fafc; border: 1px solid #94a3b8; }
    #output {
      margin-top: 16px;
      padding: 14px;
      min-height: 56px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.35);
      font-family: Consolas, monospace;
      font-size: 0.9rem;
      direction: ltr;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .footer { margin-top: 18px; font-size: 0.8rem; color: #94a3b8; }
    .footer a { color: #7dd3fc; }
  </style>
</head>
<body>
  <main class="card">
    <h1>🚀 أول موقع ليا على النت</h1>
    <p>الصفحة دي بتتخدم من FastAPI، والزراير بتكلم الـ API بتاعي.</p>

    <input id="name" type="text" placeholder="اكتب اسمك" autocomplete="off">
    <button id="greetBtn">قولي أهلاً</button>
    <button id="statusBtn" class="secondary">حالة السيرفر</button>

    <div id="output">النتيجة هتظهر هنا...</div>

    <div class="footer">
      <a href="/docs" target="_blank">صفحة الـ API docs</a>
    </div>
  </main>

  <script>
    const output = document.getElementById("output");

    async function callApi(path) {
      output.textContent = "جاري التحميل... (أول مرة ممكن تاخد وقت)";
      try {
        const res = await fetch(path);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        output.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        output.textContent = "حصل خطأ: " + err.message;
      }
    }

    document.getElementById("greetBtn").addEventListener("click", () => {
      const name = document.getElementById("name").value.trim() || "صديقي";
      callApi("/api/greet/" + encodeURIComponent(name));
    });

    document.getElementById("statusBtn").addEventListener("click", () => {
      callApi("/api/status");
    });
  </script>
</body>
